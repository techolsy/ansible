---
- name: Reboot if new kernel
  hosts: vm
  gather_facts: true
  tasks:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Upgrade apt packages
      ansible.builtin.apt:
        upgrade: true

    - name: Autoremove
      ansible.builtin.apt:
        autoremove: true

    - name: Run kernel check script
      ansible.builtin.command:
        cmd: /usr/lib/nagios/plugins/check_kernel
      register: _check_kernel
      changed_when: false
      failed_when: false

    - when: not _check_kernel.stdout == "OK - Running latest installed kernel"
      block:
        - name: Reboot
          ansible.builtin.reboot:
            reboot_timeout: 1
          failed_when: false

        - name: Wait for boot
          ansible.builtin.wait_for:
            host: "{{ ansible_fqdn }}"
            port: "{{ default_ssh_port }}"
            timeout: 300
          delegate_to: localhost
